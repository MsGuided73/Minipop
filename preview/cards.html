<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root" style="width: 100vw; height: 100vh"></div>
    <script type="module" src="./cards.jsx"></script>
    <script>
      // ?reader opens the second card's document, so the drawer can be
      // screenshotted headlessly without a click.
      if (location.search.indexOf('reader') !== -1) {
        setTimeout(function () {
          var buttons = [].slice.call(document.querySelectorAll('.cl-card-open'));
          if (buttons[1]) buttons[1].click();
        }, 1200);
        // ?scroll=N scrolls the open document, to screenshot further down it.
        var m = /scroll=(\d+)/.exec(location.search);
        if (m) {
          setTimeout(function () {
            var pane = document.querySelector('.cl-reader-scroll');
            if (pane) pane.scrollTop = Number(m[1]);
          }, 2000);
        }
      }
    </script>
  </body>
</html>
